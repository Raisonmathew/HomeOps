name = "homeops-worker"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

# Non-secret config only. Secrets are set with `wrangler secret put`:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET,
#   SUPABASE_SERVICE_ROLE_KEY, INTERNAL_API_SECRET
[vars]
SUPABASE_URL = "https://your-project.supabase.co"
